<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teknocan'ın Sinyal Macerası</title>
<style>
html,body{margin:0;height:100%;background:#10182b;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{width:min(100vw,calc(100vh*960/560));height:auto;aspect-ratio:960/560;display:block}
</style>
</head>
<body>
<canvas id="c" width="960" height="560"></canvas>
<script>
/* =====================================================================
   GÖRSEL AYARLARI
   Kendi görsellerini kullanmak için dosya adını yaz, dosyayı bu HTML'in
   yanına koy. Şeffaf arka planlı PNG önerilir. Karakterler SAĞA bakacak
   şekilde çizilmiş olmalı (sola giderken otomatik çevrilir).
   null bırakırsan oyun kendi çizdiği yer tutucuyu kullanır.
   ===================================================================== */
const ASSETS = {
  player:  "teknocan.png",   // ana karakter (Teknocan)
  bear:    null,             // ayı
  wolf:    null,             // kurt
  ninja:   null,             // ninja
  crow:    null,             // karga
  bar:     null,             // sinyal çubuğu simgesi
  tower:   null              // baz istasyonu kulesi
};
const PLAYER_DRAW_HEIGHT = 72;   // karakterin ekranda görünen yüksekliği (piksel)

/* ---------- görsel yükleme ---------- */
const SPR = {};
for (const k in ASSETS) {
  if (!ASSETS[k]) continue;
  const im = new Image();
  im.onload = () => { SPR[k] = im; };
  im.onerror = () => {};
  im.src = ASSETS[k];
}
function drawFit(im, cx, bottom, h, flip, sq = 1, rot = 0) {
  const s = h / im.height, w = im.width * s;
  ctx.save();
  ctx.translate(cx, bottom);
  if (rot) ctx.rotate(rot);
  if (flip) ctx.scale(-1, 1);
  if (sq !== 1) ctx.scale(1 + (1 - sq) * 0.3, sq);
  ctx.drawImage(im, -w / 2, -h, w, h);
  ctx.restore();
}

/* ---------- ses ---------- */
let AC = null;
function beep(f, d = 0.1, type = "square", v = 0.04, slide = 0) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(f, n);
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, n + d);
    g.gain.setValueAtTime(v, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + d);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(n + d);
  } catch (e) {}
}

/* ---------- temel ---------- */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const T = 40, W = 960, H = 560, ROWS = 14, COLS = 315;
const SOLID = new Set(["G", "D", "H", "W", "B", "Q", "U", "P", "F"]);
const GOAL = { x: 303 * T, y: 3 * T, w: 3 * T, h: 8 * T };
/* ---------- BÖLÜM BÖLGELERİ (sütun numaraları) ---------- */
// köy 0-63 • DERE 64-105 • köy yolu 106-177 • ORMAN 178-217 • dağ yolu 218-276 • BOSS arenası 281-297 • baz istasyonu 303
const RIVER = [64, 105];        // dere: zemin yok, kayan platformlarla geçilir; suya düşen can kaybeder
const FOREST = [178, 217];      // orman: tramplen ve yüksek taş duvar
const RAISED = 277;             // yüksek zemin başlangıcı (boss arenası + baz istasyonu)
const ARENA = [281, 297];       // boss arenası
const GATE = [298, 299];        // boss yenilene kadar kapalı taş kapı
const WIND_ZONES = [{ a: 224, b: 240, dir: 1, off: 0 }, { a: 252, b: 274, dir: -1, off: 140 }];   // dir 1 = arkadan, -1 = karşıdan
const WIND_FORCE = 1.6;         // tam rüzgârda oyuncuyu iten hız (piksel/kare, havada 1.5 katı)
const SPRING_VY = 16.5;         // tramplenin zıplatma gücü
const S = c => c < 60 ? c : c < 126 ? c + 50 : c + 92;   // ilk bölümün sütun numaralarını yeni yerine taşır
/* ---------- ZORLUK AYARLARI ---------- */
const START_LIVES = 3;      // herkese verilen can sayısı (oyun boyunca artmaz)
const BAR_BONUS = 0.2;      // toplanan her sinyal çubuğunun bitiş süresinden düşürdüğü saniye (sunucudaki BAR_BONUS ile aynı olmalı)
const PH = 38, CROUCH_H = 22;   // ayakta ve eğilmiş karakter yüksekliği (piksel)
const ARROW_SPEED = 6.6;    // ninjanın kırmızı oklarının hızı
const ARROW_EVERY = 70;     // iki ok arası (kare)
const SPEED_START = 0.6;    // bölüm başındaki düşman hız çarpanı
const SPEED_GROWTH = 0.65;  // bölüm sonuna kadar eklenen hız (başta 0.6x, sonda ~1.25x)
// [sütun, zemin satırı]: bu sütunu geçince oyuncu ölürse buradan devam eder
const CHECKPOINTS = [[38, 12], [62, 12], [86, 12], [108, 12], [131, 12], [150, 12], [180, 12], [202, 12], [218, 12], [240, 12], [264, 12], [277, 11], [281, 11]];
const POWER_TIME = 480;     // güçlü sinyalin süresi (kare; 60 kare = 1 saniye)
const MAGNET_RADIUS = 150;  // mıknatısın sinyal çubuklarını çektiği mesafe (piksel)
const ITEM_SPEED = 3.0;     // ? bloğundan çıkan güçlü sinyalin kaçış hızı
const ITEM_HOP = 6;         // kaçarken zıplama gücü
const ITEM_LIFE = 480;      // yakalanmazsa bu kadar kare sonra kaybolur
const WIN_SCENE = 560;      // bitişteki tırmanış + kutlama sahnesinin süresi (kare)
let grid, enemies, bars, items, decor, parts, arrows = [];
let plats = [], springs = [], fallers = [], windNow = 0, bannerT = 0, bossBeaten = false;
let state = "title", score = 0, lives = 3, barCount = 0, cam = 0, tick = 0, winT = 0;
let cp = { x: 2 * T, y: 12 * T - 39 };
const keys = {};
const p = { x: 0, y: 0, w: 28, h: 38, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, buf: 0, inv: 0, power: 0, anim: 0, crouch: false, cl: 0, spr: 0, ride: null };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const solid = (c, r) => {
  if (c < 0 || c >= COLS) return true;
  if (r < 0 || r >= ROWS) return false;
  return SOLID.has(grid[r][c]);
};

/* ---------- çoklu oyuncu ---------- */
let nameBuf = "", myName = "", myId = null, online = false, ws = null, onlineCount = 0;
let others = {}, board = [], myRank = null, boardTotal = 0, runTicks = 0, finalTime = 0;
try { nameBuf = localStorage.getItem("teknocanName") || ""; } catch (e) {}
function net(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function fmtTime(s) { const m = Math.floor(s / 60); return m + ":" + (s - m * 60).toFixed(1).padStart(4, "0"); }
function connect() {
  if (location.protocol === "file:") return;
  try { ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host); } catch (e) { return; }
  ws.onopen = () => {
    online = true;
    if (myName) { net({ t: "join", name: myName }); if (state === "play") net({ t: "start", el: runTicks / 60 }); }
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.t === "hello") myId = m.id;
    else if (m.t === "welcome") myName = m.name;
    else if (m.t === "p") {
      const seen = {};
      m.l.forEach(a => {
        if (a[0] === myId) return;
        seen[a[0]] = 1;
        let o = others[a[0]];
        if (!o) o = others[a[0]] = { id: a[0], x: a[2], y: a[3] };
        o.n = a[1]; o.tx = a[2]; o.ty = a[3]; o.f = a[4]; o.a = a[5]; o.st = a[6] ? "win" : "play"; o.c = a[7] || 0;
      });
      for (const id in others) if (!seen[id]) delete others[id];
    } else if (m.t === "board") { board = m.top; myRank = m.rank; boardTotal = m.total; onlineCount = m.on; }
  };
  ws.onclose = () => { online = false; others = {}; ws = null; setTimeout(connect, 3000); };
  ws.onerror = () => {};
}
function beginRun() {
  myName = nameBuf.trim().replace(/\s+/g, " ");
  try { localStorage.setItem("teknocanName", myName); } catch (e) {}
  net({ t: "join", name: myName });
  startGame();
  beep(700, 0.15, "triangle", 0.05, 300);
}

/* ---------- bölüm ---------- */
function buildLevel() {
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill("."));
  enemies = []; bars = []; items = []; decor = []; parts = []; arrows = [];
  plats = []; springs = []; fallers = []; bossBeaten = false; bannerT = 0;
  const set = (c, r, ch) => { if (c >= 0 && c < COLS && r >= 0 && r < ROWS) grid[r][c] = ch; };
  const ground = (a, b, top = 12) => {
    for (let c = a; c <= b; c++) { set(c, top, "G"); for (let r = top + 1; r < ROWS; r++) set(c, r, "D"); }
  };
  const line = (c, r, n) => {
    for (let i = 0; i < n; i++) bars.push({ x: (c + i) * T + T / 2, y: r * T + T / 2, got: false, ph: Math.random() * 6 });
  };

  // zemin: baştan sona kesintisiz; yüksek zemin ve dere aşağıda işlenir
  ground(0, COLS - 1); ground(RAISED, COLS - 1, 11);
  // DERE: iki kıyı arasındaki zemin kalkar, üzerinden kayan platformlarla geçilir
  for (let c = RIVER[0]; c <= RIVER[1]; c++) for (let r = 12; r < ROWS; r++) set(c, r, ".");
  // ortada küçük bir ada: dinlenme ve kontrol noktası (sütun 85-87)
  for (let c = 85; c <= 87; c++) { set(c, 12, "G"); set(c, 13, "D"); }
  [[2700, 440, "h", 60, 0.022, 0], [2900, 430, "v", 36, 0.020, 1.2], [3100, 440, "h", 60, 0.025, 1.5], [3300, 425, "v", 40, 0.020, 3],
   [3650, 440, "h", 60, 0.027, 4.4], [3820, 430, "v", 36, 0.024, 0.8], [3990, 440, "h", 60, 0.022, 2.3], [4150, 430, "v", 36, 0.020, 5]]
    .forEach(a => plats.push({ x0: a[0] - 60, y0: a[1], w: 120, kind: a[2], amp: a[3], f: a[4], ph: a[5],
      x: a[0] - 60 + (a[2] === "h" ? a[3] * Math.sin(a[5]) : 0), y: a[1] + (a[2] === "v" ? a[3] * Math.sin(a[5]) : 0), dx: 0, dy: 0 }));

  // su kuyuları
  [28, S(135), S(145)].forEach(c => { set(c, 10, "P"); set(c + 1, 10, "P"); set(c, 11, "P"); set(c + 1, 11, "P"); });
  // saman balyaları
  set(21, 11, "H"); set(45, 11, "H"); set(46, 11, "H"); set(46, 10, "H"); set(47, 11, "H"); set(51, 11, "H"); set(S(149), 11, "H");
  set(S(183), 11, "H"); set(S(184), 11, "H");
  // sandık ve bonus blokları
  ["B", "Q", "B", "B", "B"].forEach((ch, i) => set(52 + i, 9, ch));
  ["B", "B", "Q", "B", "B"].forEach((ch, i) => set(S(150) + i, 9, ch));
  // taş duvar merdiveni
  [[116, 11], [117, 11], [117, 10], [118, 11], [118, 10], [118, 9], [119, 11], [119, 10], [120, 11]].forEach(a => set(S(a[0]), a[1], "W"));

  // ORMAN: yüksek duvarı aşmak için tramplen şart; üstteki platformlar isteğe bağlı bonus
  const spring = c => springs.push({ x: c * T, y: 12 * T - 20, w: T, h: 20, sq: 0, cd: 0 });
  spring(181); spring(195); spring(203);
  for (let c = 184; c <= 188; c++) set(c, 7, "F");                       // yüksek platform A (tramplen 181 ile çıkılır)
  for (let r = 7; r <= 11; r++) { set(199, r, "W"); set(200, r, "W"); }  // 5 blok yüksek duvar: tramplen 195 ile aşılır
  for (let c = 205; c <= 211; c++) set(c, 7, "F");                       // yüksek platform B (tramplen 203 ile çıkılır)
  set(208, 5, "Q");                                                      // platform B'de güçlü sinyal bloğu

  // sinyal çubukları (ilk bölümdeki numaralar S() ile yeni yerlerine taşınır)
  const L = (c, r, n) => line(S(c), r, n);
  L(8, 9, 3); L(11, 8, 3); L(20, 10, 2); L(31, 9, 6); L(44, 8, 3); L(52, 8, 5);
  L(64, 10, 2); L(68, 9, 2); L(72, 10, 2); L(74, 9, 2); L(77, 10, 2); L(86, 10, 3); L(90, 9, 4);
  L(104, 9, 3); L(116, 7, 4); L(125, 9, 3); L(135, 8, 2); L(145, 8, 2); L(150, 8, 5);
  L(158, 9, 3); L(165, 9, 5); L(172, 9, 3);
  [67, 72, 77, 82, 91, 95, 99, 103].forEach(c => line(c, 8, 2)); line(85, 9, 3);         // dere platformlarının üstü
  line(185, 6, 4); line(186, 5, 3); line(206, 6, 5); line(190, 10, 3); line(210, 10, 3);   // orman
  line(279, 9, 3); line(285, 9, 3);                                                       // arena girişi

  // düşmanlar
  const gy = c => { for (let r = 9; r < ROWS; r++) if (SOLID.has(grid[r][c])) return r * T; return H; };
  const E = (type, c, o = {}) => {
    const d = {
      bear: { w: 42, h: 40, vx: -0.8 }, wolf: { w: 44, h: 28, vx: -1.5 },
      crow: { w: 34, h: 24, vx: -1.2 }, rock: { w: 34, h: 34, vx: 1.4 }, mud: { w: 40, h: 14, vx: 0 },
      ninja: { w: 28, h: 38, vx: 0 }
    }[type];
    d.vx *= SPEED_START + SPEED_GROWTH * (c / COLS);
    const e = Object.assign({ type, x: c * T + (T - d.w) / 2, dead: false, t: 0, ph: Math.random() * 6, rot: 0 }, d, o);
    e.y = o.row != null ? o.row * T : gy(c) - d.h;
    e.baseY = e.y;
    if ((type === "bear" || type === "wolf") && e.min == null) { e.min = (c - 6) * T; e.max = (c + 7) * T; }   // devriye alanı
    enemies.push(e);
  };
  [16, 43, S(86), S(113), S(131), S(155), 214].forEach(c => E("bear", c));
  [S(94), S(128), S(140), 190].forEach(c => E("wolf", c));
  [S(98), S(141)].forEach(c => E("crow", c, { row: 9, min: (c - 5) * T, max: (c + 5) * T }));
  // ninja: kırmızı ok atar. H = yüksek ok (eğil ya da zıpla), L = alçak ok (zıpla), B = ikisi birden (yükseğe zıpla)
  [[S(74), "HLBHLHB"], [S(168), "LHBLHBH"]].forEach(a => E("ninja", a[0], { cd: 80, pi: 0, pat: a[1] }));
  [[S(106), S(103), S(110)], [S(160), S(156), S(163)], [S(178), S(174), S(182)]].forEach(a => E("rock", a[0], { min: a[1] * T, max: a[2] * T }));
  // boss kaldırıldı: yol kuleye açık

  // dekor
  const explicit = [["house", 9], ["windmill", S(97)], ["house", S(132)], ["windmill", S(158)], ["house", S(174)], ["sign", S(100)], ["sign", S(128)], ["sign", 61], ["sign", 108], ["sign", 176]];
  explicit.forEach(a => decor.push({ t: a[0], x: a[1] * T, y: 12 * T, v: 0.5 }));
  let s = 12345;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let c = 3; c < COLS - 3; c += 2) {
    if (rnd() < 0.5 && !(c >= 300 && c <= 310) && !explicit.some(a => Math.abs(a[1] - c) < 4)) {
      let r = -1;
      for (let rr = 10; rr < ROWS; rr++) if (SOLID.has(grid[rr][c])) { r = rr; break; }
      if (r >= 0 && grid[r][c] === "G") decor.push({ t: ["tree", "bush", "fence", "haystack"][Math.floor(rnd() * 4)], x: c * T, y: r * T, v: rnd() });
    }
  }
}

/* ---------- oyun akışı ---------- */
function startGame() {
  buildLevel();
  score = 0; lives = START_LIVES; barCount = 0; winT = 0;
  p.h = PH; p.crouch = false; p.cl = 0; topAt = -1; finalBonus = 0; arrows = [];
  cp = { x: 2 * T, y: 12 * T - PH - 1 };
  Object.assign(p, { x: cp.x, y: cp.y, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, buf: 0, inv: 0, power: 0, anim: 0, spr: 0, ride: null });
  cam = 0;
  runTicks = 0; finalTime = 0; villagers = [];
  state = "play";
  net({ t: "start", el: 0 });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 5 - 1, life: 30 + Math.random() * 20, color, size: 3 + Math.random() * 4 });
}
function hurt(force) {
  if (!force && p.inv > 0) return;
  lives--;
  beep(220, 0.4, "sawtooth", 0.05, -150);
  burst(p.x + p.w / 2, p.y + p.h / 2, "#ff5a4f", 14);
  if (lives <= 0) { state = "gameover"; net({ t: "over", score }); return; }
  p.h = PH; p.crouch = false; arrows = []; fallers = []; p.ride = null; p.spr = 0;
  const bs = enemies.find(e => e.type === "boss");
  if (bs && !bs.dead) { bs.x = 291 * T; bs.st = "idle"; bs.stT = 90; bs.vx = 0; bs.inv = 0; bs.rockT = 150; }   // boss'un canı korunur, yeri sıfırlanır
  p.x = cp.x; p.y = cp.y; p.vx = 0; p.vy = 0; p.inv = 120; p.power = 0;
  cam = clamp(p.x - W * 0.4, 0, COLS * T - W);
}
function hitTile(c, r) {
  const ch = grid[r][c];
  if (ch === "B") { grid[r][c] = "."; score += 20; burst(c * T + T / 2, r * T + T / 2, "#b9793c", 10); beep(150, 0.12, "square", 0.05); }
  else if (ch === "Q") {
    grid[r][c] = "U";
    items.push({ x: c * T + 5, y: r * T, ty: (r - 1) * T + 4, w: 30, h: 30,
      vx: ITEM_SPEED, vy: 0, life: ITEM_LIFE, free: false });
    beep(520, 0.15, "triangle", 0.06, 300);
  } else beep(110, 0.06, "square", 0.03);
}
function moveX() {
  p.x += p.vx;
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - 0.01) / T);
  const r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - 0.01) / T);
  for (let r = r0; r <= r1; r++) {
    if (p.vx > 0 && solid(c1, r)) { p.x = c1 * T - p.w; p.vx = 0; break; }
    if (p.vx < 0 && solid(c0, r)) { p.x = (c0 + 1) * T; p.vx = 0; break; }
  }
}
function moveY() {
  p.y += p.vy;
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - 0.01) / T);
  const r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - 0.01) / T);
  p.onGround = false;
  if (p.vy > 0) {
    for (let c = c0; c <= c1; c++) if (solid(c, r1)) { p.y = r1 * T - p.h; p.vy = 0; p.onGround = true; break; }
  } else if (p.vy < 0) {
    let best = -1, bd = 1e9;
    for (let c = c0; c <= c1; c++) if (solid(c, r0)) {
      const d = Math.abs(c * T + T / 2 - (p.x + p.w / 2));
      if (d < bd) { bd = d; best = c; }
    }
    if (best >= 0) { hitTile(best, r0); p.y = (r0 + 1) * T; p.vy = 0; }
  }
}
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function stepItem(it) {
  it.vy = Math.min(it.vy + 0.5, 12);
  it.x += it.vx;
  let c0 = Math.floor(it.x / T), c1 = Math.floor((it.x + it.w - 0.01) / T);
  const r0 = Math.floor(it.y / T);
  let r1 = Math.floor((it.y + it.h - 0.01) / T);
  for (let r = r0; r <= r1; r++) {
    if (it.vx > 0 && solid(c1, r)) { it.x = c1 * T - it.w; it.vx = -it.vx; break; }
    if (it.vx < 0 && solid(c0, r)) { it.x = (c0 + 1) * T; it.vx = -it.vx; break; }
  }
  it.y += it.vy;
  c0 = Math.floor(it.x / T); c1 = Math.floor((it.x + it.w - 0.01) / T);
  r1 = Math.floor((it.y + it.h - 0.01) / T);
  if (it.vy > 0) {
    for (let c = c0; c <= c1; c++) if (solid(c, r1)) { it.y = r1 * T - it.h; it.vy = -ITEM_HOP; break; }
  }
}

function canStand() {
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - 0.01) / T);
  const r0 = Math.floor((p.y - (PH - CROUCH_H)) / T), r1 = Math.floor((p.y - 0.01) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solid(c, r)) return false;
  return true;
}

function updatePlats() {
  plats.forEach(pl => {
    const sn = Math.sin(runTicks * pl.f + pl.ph);
    const nx = pl.kind === "h" ? pl.x0 + pl.amp * sn : pl.x0, ny = pl.kind === "v" ? pl.y0 + pl.amp * sn : pl.y0;
    pl.dx = nx - pl.x; pl.dy = ny - pl.y; pl.x = nx; pl.y = ny;
  });
}
function bossDown() {
  score += 500; bossBeaten = true; bannerT = 300; fallers = [];

let villagers = [], topAt = -1, finalBonus = 0, bFlash = 0;

/* ---------- hava durumu: dağa tırmandıkça kötüleşir ---------- */
const sm = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wx = { alt: 0, storm: 0, rain: 0, snow: 0, fog: 0, clear: 0, flash: 0, boltX: 0 };
const drops = Array.from({ length: 320 }, () => ({ x: Math.random() * W, y: Math.random() * H, v: 11 + Math.random() * 7 }));

function updateWeather() {
  const alt = state === "title" ? 0 : clamp(p.x / (COLS * T), 0, 1);
  const clear = state === "win" ? clamp(winT / 200, 0, 1) : 0;   // bitince hava açılır
  wx.alt = alt; wx.clear = clear;
  wx.storm = sm(0.22, 0.88, alt) * (1 - clear);
  wx.rain = sm(0.28, 0.7, alt) * (1 - sm(0.78, 0.9, alt)) * (1 - clear);
  wx.snow = sm(0.74, 0.92, alt) * (1 - clear);
  wx.fog = sm(0.4, 0.95, alt) * (1 - clear * 0.9);
  const wind = 2 + 7 * wx.storm;
  for (const d of drops) {
    d.y += d.v; d.x -= wind * 0.6;
    if (d.y > H) { d.y = -20; d.x = Math.random() * (W + 120); }
    if (d.x < -20) d.x += W + 40;
  }
  for (const f of flakes) {
    f.y += f.v; f.x += Math.sin(tick * 0.03 + f.ph) * 0.6 - wind * 0.35;
    if (f.y > H + 5) { f.y = -5; f.x = Math.random() * (W + 100); }
    if (f.x < -10) f.x += W + 20;
  }
  if (wx.flash > 0) wx.flash--;
  else if (wx.storm > 0.55 && Math.random() < 0.003 * wx.storm) {
    wx.flash = 10; wx.boltX = 80 + Math.random() * (W - 160);
    try { setTimeout(() => beep(55, 0.8, "sawtooth", 0.06, -20), 350 + Math.random() * 500); } catch (e) {}
  }

/* bitiş: Teknocan kuleye yürür, tırmanır ve tepede zıplar */
function winHero() {
  const cx = GOAL.x + 60 - p.w / 2, topY = 11 * T - 298 - PH;
  if (p.cl === 0) {
    const d = cx - p.x;
    p.face = d >= 0 ? 1 : -1;
    p.vy = Math.min(p.vy + 0.55, 13);
    if (Math.abs(d) > 3) { p.vx = Math.sign(d) * 3; p.anim += 0.5; moveX(); } else { p.x = cx; p.vx = 0; }
    moveY();
    if (Math.abs(d) <= 3 && p.onGround) { p.cl = 1; p.vy = 0; p.vx = 0; p.face = 1; }
  } else if (p.cl === 1) {
    p.vy = 0; p.y -= 1.5; p.anim += 0.2;
    if (winT % 14 === 0) beep(300 + (Math.floor(p.y) % 7) * 25, 0.05, "square", 0.025);
    if (p.y <= topY) {
      p.y = topY; p.cl = 2; p.vy = 0; topAt = winT;
      beep(784, 0.4, "triangle", 0.06, 300);
      burst(GOAL.x + 60, topY + 10, "#ffd23f", 18);
    }
  } else {
    p.vy += 0.55; p.y += p.vy;
    if (p.y >= topY) { p.y = topY; p.vy = 0; if ((winT - topAt) % 50 === 0) { p.vy = -8; beep(500, 0.1, "triangle", 0.04, 200); } }
  }

function update() {
  tick++;
  if (bFlash > 0) bFlash--;
  if (bannerT > 0) bannerT--;
  for (const id in others) { const o = others[id]; o.x += (o.tx - o.x) * 0.3; o.y += (o.ty - o.y) * 0.3; }
  if (online && tick % 4 === 0 && (state === "play" || state === "win")) net({ t: "s", x: Math.round(p.x), y: Math.round(p.y), f: p.face, a: +p.anim.toFixed(1), sc: score, st: state, c: state === "win" && p.cl === 1 ? 2 : (p.crouch ? 1 : 0) });
  if (state === "play") updatePlay();
  if (state === "win") {
    winT++;
    winHero();
    if (topAt >= 0 && winT % 12 === 0) burst(GOAL.x + 60 + (Math.random() - 0.5) * 200, 11 * T - 150 - Math.random() * 150, ["#ffd23f", "#40c4ff", "#ff6b6b", "#7dff7d"][winT % 4], 12);
    if (topAt >= 0 && winT - topAt > 10 && winT % 3 === 0) for (let i = 0; i < 2; i++) parts.push({ x: cam + Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 2, vy: Math.random() * 2, life: 90, color: ["#ffd23f", "#40c4ff", "#ff6b6b", "#7dff7d", "#ff9ff3"][Math.floor(Math.random() * 5)], size: 4 + Math.random() * 4 });
    villagers.forEach(v => {
      if (v.delay > 0) { v.delay--; return; }
      const d = v.tx - v.x;
      if (Math.abs(d) > 4.5) v.x += Math.sign(d) * 4.5; else v.x = v.tx;
    });

  parts = parts.filter(q => q.life > 0);

}

function txt(s, x, y, size, color, align = "left", stroke = "#10203f") {

  ctx.lineWidth = Math.max(3, size / 6); ctx.lineJoin = "round";

}
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

      ctx.fillStyle = o.hair; ctx.beginPath(); ctx.arc(0, -57, 11.5, Math.PI, 0); ctx.fill();
      circle(-14, -50, 5, o.hair); circle(14, -50, 5, o.hair); break;
    default:
      circle(-11, -53, 3, "#8a8a8a"); circle(11, -53, 3, "#8a8a8a");
  }
  if (o.scarf) { ctx.strokeStyle = o.scarf; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, -43, 9, 0.15, Math.PI - 0.15); ctx.stroke(); }
  ctx.strokeStyle = "#3a2418"; ctx.lineWidth = 2;
  if (arrived) {   // mutlu, kapalı gözler
    ctx.beginPath(); ctx.arc(-4.5, -55, 2.6, Math.PI, 0); ctx.moveTo(1.9, -55); ctx.arc(4.5, -55, 2.6, Math.PI, 0); ctx.stroke();
  } else { circle(-4.5, -55, 1.6, "#3a2418"); circle(4.5, -55, 1.6, "#3a2418"); }
  ctx.fillStyle = "#7a1f1f"; ctx.beginPath(); ctx.arc(0, -50, 4.2, 0, Math.PI); ctx.fill();
  if (o.mustache) { ctx.fillStyle = "#4a3b32"; ctx.beginPath(); ctx.ellipse(-3.5, -51.5, 4, 1.8, 0.2, 0, 7); ctx.ellipse(3.5, -51.5, 4, 1.8, -0.2, 0, 7); ctx.fill(); }
  ctx.restore();
}
function bubble(x, y, s) {
  const w = s.length * 7.4 + 18;
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#10203f"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.rect(x - w / 2, y - 24, w, 24); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x, y + 8); ctx.lineTo(x + 5, y); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.fillRect(x - 4, y - 2, 8, 3);
  ctx.font = 'bold 13px system-ui, "Segoe UI", Arial, sans-serif'; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#10203f"; ctx.fillText(s, x, y - 7);
}
function drawVillagers() {
  const base = GOAL.x + 60;
  const talk = [];
  villagers.forEach((v, idx) => {
    if (v.x < cam - 80 || v.x > cam + W + 80) return;
    const arrived = v.delay <= 0 && v.x === v.tx;
    const gyv = v.x >= RAISED * T ? 11 * T : 12 * T;
    const t = tick * 0.11 + v.ph;
    const hop = arrived ? Math.abs(Math.sin(t)) * 34 : Math.abs(Math.sin(t * 2)) * 3;
    const face = arrived ? (v.tx < base ? 1 : -1) : (v.tx < v.x ? -1 : 1);
    let bh = 90;
    if (v.kind === "bear" || v.kind === "wolf") {
      const d = v.kind === "bear" ? { w: 42, h: 40 } : { w: 44, h: 28 };
      drawEnemy({ type: v.kind, x: v.x - d.w / 2, y: gyv - hop - d.h, w: d.w, h: d.h, vx: face, dead: false, ph: v.ph });
      bh = d.h + 22;
    } else { const o = PEOPLE[v.kind]; drawPerson(v.x, gyv - hop, o, arrived, t); bh = 80 * (o.s || 1) + 22; }
    if (arrived && (Math.floor(tick / 80) + idx) % 3 === 0) talk.push([v.x, gyv - bh, v.say]);   // komşular aynı anda konuşmaz
  });
  talk.forEach(a => bubble(a[0], a[1], a[2]));   // balonlar en üstte
}
function drawCelebration() {
  if (topAt < 0) return;   // Teknocan tepeye çıkana kadar yazı yok
  const t = winT - topAt, k = Math.min(1, t / 25), bounce = 1 + Math.sin(winT * 0.15) * 0.04, bx = W - 230;
  ctx.save(); ctx.translate(bx, 120); ctx.scale(k * bounce, k * bounce);
  txt("Bağlantı kuruldu!", 0, 0, 44, "#7dff7d", "center");
  ctx.restore();
  if (t > 40) txt("Teknocan tepede, köy sinyal aldı!", bx, 158, 19, "#fff", "center", "#0f2260");
  if (t > 60) txt("Süre " + fmtTime(finalTime) + "   •   Skor " + score, bx, 188, 19, "#ffe27a", "center");
  if (t > 75 && finalBonus > 0) txt("Sinyal bonusu: -" + finalBonus.toFixed(1) + " sn", bx, 214, 16, "#9dffb0", "center", "#0f2260");
  if (t > 90 && Math.floor(tick / 30) % 2 === 0) txt("ENTER: sonuçları gör", W / 2, 524, 22, "#fff", "center");
}
function drawWeather() {
  const st = wx.storm;
  if (st > 0.01) { ctx.fillStyle = "rgba(14,20,38," + (0.26 * st) + ")"; ctx.fillRect(0, 0, W, H); }
  if (wx.fog > 0.01) {
    const g = ctx.createLinearGradient(0, 180, 0, H);
    g.addColorStop(0, "rgba(225,232,240,0)"); g.addColorStop(1, "rgba(225,232,240," + (0.5 * wx.fog) + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 180, W, H - 180);
    ctx.fillStyle = "rgba(230,236,244," + (0.10 * wx.fog) + ")";
    for (let i = 0; i < 4; i++) {
      const fx = ((i * 330 - tick * (0.4 + i * 0.15)) % 1400 + 1400) % 1400 - 300;
      ctx.beginPath(); ctx.ellipse(fx + 260, 330 + i * 40, 300, 32, 0, 0, 7); ctx.fill();
    }
  }
  const nr = Math.floor(drops.length * wx.rain);
  if (nr > 0) {
    ctx.strokeStyle = "rgba(190,215,240," + (0.35 + 0.3 * st) + ")"; ctx.lineWidth = 1.6; ctx.beginPath();
    const slant = 2 + 7 * st;
    for (let i = 0; i < nr; i++) { const d = drops[i]; ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - slant, d.y + d.v * 1.4); }
    ctx.stroke();
  }
  const nf = Math.floor(flakes.length * wx.snow);
  if (nf > 0) {
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    for (let i = 0; i < nf; i++) { const f = flakes[i]; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); }
  }
  drawWindFx();
  if (wx.flash > 0) {   // şimşek
    if (wx.flash > 5) {
      ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 3; ctx.beginPath();
      let bx = wx.boltX, by = 0; ctx.moveTo(bx, by);
      for (let i = 0; i < 7; i++) { bx += (Math.random() - 0.5) * 50; by += 55; ctx.lineTo(bx, by); }
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(235,240,255," + (0.5 * wx.flash / 10) + ")"; ctx.fillRect(0, 0, W, H);
  }
}

function drawHUD() {
  ctx.fillStyle = "rgba(10,20,50,0.55)"; ctx.fillRect(0, 0, W, 46);
  txt("CAN", 16, 31, 18, "#fff", "left");
  txt("♥ ×" + lives, 66, 31, 22, "#ff6b6b", "left");
  txt("SİNYAL", 170, 31, 18, "#fff", "left");
  txt("×" + barCount, 252, 31, bFlash > 0 ? 24 : 20, bFlash > 0 ? "#fff3a0" : "#ffc400", "left");
  txt("SKOR " + score, W - 16, 31, 22, "#ffe27a", "right");
  txt("SÜRE " + fmtTime(Math.max(0, runTicks / 60 - barCount * BAR_BONUS)), 326, 31, 18, "#fff", "left");
  if (barCount > 0) txt("-" + (barCount * BAR_BONUS).toFixed(1), 452, 31, bFlash > 0 ? 17 : 14, "#7dff7d", "left");
  if (state !== "win") drawBoardHUD();
  if (Math.abs(windNow) > 0.3) txt(windNow > 0 ? "RÜZGÂR  ►►►" : "◄◄◄  RÜZGÂR", W / 2 - 150, 74, 17, "#cfe9ff", "center");
  const bs = enemies.find(e => e.type === "boss");
  if (bs && !bs.dead && p.x > (ARENA[0] - 8) * T && state === "play") {
    txt("DEV AYI", W / 2, 100, 16, "#ffd0d0", "center");
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(W / 2 - 150, 106, 300, 12);
    ctx.fillStyle = "#e11d1d"; ctx.fillRect(W / 2 - 148, 108, 296 * bs.hp / 3, 8);
  }
  if (bannerT > 0 && state === "play") txt("DEV AYI YENİLDİ!  Kule yolu açıldı ►", W / 2, 140, 26, "#7dff7d", "center");
  if (p.power > 0) {
    txt("GÜÇLÜ SİNYAL", W / 2 + 90, 31, 16, "#40c4ff", "center");
    ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(W / 2 + 20, 36, 140, 5);
    ctx.fillStyle = "#40c4ff"; ctx.fillRect(W / 2 + 20, 36, 140 * (p.power / POWER_TIME), 5);
    txt("KALKAN • MIKNATIS • SÜPER ZIPLAMA", W / 2 + 90, 64, 12, "#bfeaff", "center");
  }
}

function panel(y, h) {
  ctx.fillStyle = "rgba(8,16,40,0.78)"; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#1b3a8a"); g.addColorStop(1, "#0f2260");
  ctx.fillStyle = g; ctx.fillRect(110, y, W - 220, h);
  ctx.strokeStyle = "#ffc400"; ctx.lineWidth = 5; ctx.strokeRect(110, y, W - 220, h);
}
function rowLine(r, rank, x, y, w, size, nmax) {
  const me = r.n === myName;
  let nm = r.n; if (nm.length > nmax) nm = nm.slice(0, nmax - 1) + "…";
  txt(rank + ".", x, y, size, "#ffc400", "left");
  txt((r.live ? "● " : "") + nm, x + size * 1.9, y, size, me ? "#7dff7d" : "#ffffff", "left");
  txt(r.fin ? fmtTime(r.tm) : "%" + Math.round(r.pr * 100), x + w, y, size, r.fin ? "#ffe27a" : "#cfe4ff", "right");
}
function drawBoardHUD() {
  const x = W - 196, y = 54, rows = board.slice(0, 5);
  const extra = myRank && myRank > 5 ? 22 : 0;
  ctx.fillStyle = "rgba(10,20,50,0.55)"; ctx.fillRect(x, y, 184, 34 + rows.length * 20 + extra);
  txt("SIRALAMA", x + 10, y + 20, 13, "#ffc400", "left");
  txt(online ? "● " + Math.max(1, onlineCount) + " kişi" : "○ çevrimdışı", x + 174, y + 20, 11, online ? "#7dff7d" : "#ff9a9a", "right");
  rows.forEach((r, i) => rowLine(r, i + 1, x + 10, y + 42 + i * 20, 164, 13, 9));
  if (extra) txt("Sen: " + myRank + ". / " + boardTotal, x + 10, y + 42 + rows.length * 20 + 4, 12, "#7dff7d", "left");
}
function resultBoard(y0, n, showMe) {
  const x = W / 2 - 210;
  board.slice(0, n).forEach((r, i) => rowLine(r, i + 1, x, y0 + i * 26, 420, 18, 14));
  if (!board.length) txt("Henüz kayıt yok, ilk sen ol!", W / 2, y0, 16, "#cfe4ff", "center", "#0f2260");
  if (showMe && myRank && myRank > n) txt("Sen: " + myRank + ". sıra / " + boardTotal + " oyuncu", W / 2, y0 + n * 26 + 6, 16, "#7dff7d", "center", "#0f2260");
}
function drawOverlay() {
  if (state === "title") {
    panel(24, 512);
    txt("Teknocan'ın", W / 2, 84, 40, "#ffc400", "center");
    txt("Sinyal Macerası", W / 2, 134, 48, "#ffffff", "center");
    txt("Köye sinyal götürmek için tepedeki baz istasyonuna ulaş!", W / 2, 168, 18, "#cfe4ff", "center", "#0f2260");
    txt("Kullanıcı adın:", W / 2, 212, 17, "#fff", "center", "#0f2260");
    ctx.fillStyle = "#0b1740"; ctx.fillRect(310, 222, 340, 44);
    ctx.strokeStyle = nameBuf.trim() ? "#7dff7d" : "#ffc400"; ctx.lineWidth = 3; ctx.strokeRect(310, 222, 340, 44);
    if (!nameBuf) txt("adını yaz...", W / 2, 253, 22, "#6f86c4", "center", "#0b1740");
    txt(nameBuf + (Math.floor(tick / 30) % 2 === 0 ? "|" : ""), W / 2, 254, 26, "#fff", "center", "#0b1740");
    txt(online ? "● Sunucuya bağlı  •  " + Math.max(0, onlineCount) + " oyuncu çevrimiçi" : "○ Çevrimdışı mod: sunucuya bağlanılamadı, skorlar kaydedilmez",
        W / 2, 292, 15, online ? "#7dff7d" : "#ff9a9a", "center", "#0f2260");
    if (!SPR.player) txt("teknocan.png bulunamadı, yer tutucu karakter kullanılıyor.", W / 2, 312, 13, "#ffb4b4", "center", "#0f2260");
    txt("←  →  Hareket   •   Boşluk / ↑  Zıpla   •   ↓  Eğil", W / 2, 342, 19, "#fff", "center", "#0f2260");
    txt("Düşmana bas  •  Her sinyal çubuğu bitiş süreni " + BAR_BONUS + " sn kısaltır  •  ? bloğu: Güçlü Sinyal", W / 2, 364, 14, "#ffe27a", "center", "#0f2260");
    txt("3 canın var  •  Kırmızı oklardan eğilerek (↓) ya da zıplayarak kurtul", W / 2, 384, 14, "#ffb4b4", "center", "#0f2260");
    txt("EN İYİLER", W / 2, 410, 16, "#ffc400", "center", "#0f2260");
    resultBoard(434, 3, false);
    if (nameBuf.trim()) { if (Math.floor(tick / 30) % 2 === 0) txt("Başlamak için ENTER", W / 2, 520, 24, "#7dff7d", "center", "#0f2260"); }
    else txt("Başlamak için bir kullanıcı adı yaz", W / 2, 520, 20, "#9fb4e8", "center", "#0f2260");
  } else if (state === "gameover") {
    panel(40, 480);
    txt("Bağlantı koptu!", W / 2, 100, 48, "#ff6b6b", "center");
    txt("Skor " + score + "   •   Yol %" + Math.round(clamp(p.x / (COLS * T), 0, 1) * 100), W / 2, 138, 22, "#ffe27a", "center");
    txt("SIRALAMA", W / 2, 182, 18, "#ffc400", "center", "#0f2260");
    resultBoard(208, 8, true);
    txt("ENTER: tekrar dene   •   ESC: ismi değiştir", W / 2, 500, 20, "#7dff7d", "center", "#0f2260");
  } else if (state === "win" && winT < WIN_SCENE) {
    drawCelebration();
  } else if (state === "win") {
    panel(40, 480);
    txt("Bağlantı kuruldu!", W / 2, 100, 48, "#7dff7d", "center");
    txt("Süre " + fmtTime(finalTime) + "   •   Skor " + score, W / 2, 138, 22, "#ffe27a", "center");
    if (finalBonus > 0) txt("(sinyal bonusu: -" + finalBonus.toFixed(1) + " sn dahil)", W / 2, 162, 15, "#9dffb0", "center", "#0f2260");
    txt("SIRALAMA", W / 2, 182, 18, "#ffc400", "center", "#0f2260");
    resultBoard(208, 8, true);
    txt("ENTER: tekrar oyna   •   ESC: ismi değiştir", W / 2, 500, 20, "#fff", "center", "#0f2260");
  }
}

function draw() {
  drawSky();
  ctx.save(); ctx.translate(-Math.round(cam), 0);
  const c0 = Math.floor(cam / T) - 1, c1 = Math.ceil((cam + W) / T) + 1;
  decor.forEach(d => { if (d.x > cam - 200 && d.x < cam + W + 100) drawDecor(d); });
  drawTower();
  drawWater(c0, c1);
  for (let r = 0; r < ROWS; r++) for (let c = Math.max(0, c0); c <= Math.min(COLS - 1, c1); c++) {
    const ch = grid[r][c]; if (ch !== ".") drawTile(ch, c, r);
  }
  drawPlats(); drawSprings();
  drawBars(); drawItems();
  enemies.forEach(e => { if (state !== "win" && e.x > cam - 80 && e.x < cam + W + 80) drawEnemy(e); });
  for (const id in others) { const o = others[id]; if (o.x > cam - 80 && o.x < cam + W + 80) drawGhost(o); }
  arrows.forEach(drawArrow); fallers.forEach(drawFaller);
  if (state === "win") drawVillagers();
  if (state !== "title") drawPlayer();
  parts.forEach(q => { ctx.globalAlpha = clamp(q.life / 20, 0, 1); ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, q.size, q.size); });
  ctx.globalAlpha = 1;
  ctx.restore();
  drawWeather();
  if (state !== "title") drawHUD();
  drawOverlay();
}

/* ---------- girdi ---------- */
window.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
  if (state === "title") {
    if (e.key === "Backspace") { nameBuf = nameBuf.slice(0, -1); e.preventDefault(); }
    else if (e.code === "Enter" && !e.repeat) { if (nameBuf.trim()) beginRun(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && nameBuf.length < 14 && /[\p{L}\p{N} _.\-]/u.test(e.key)) nameBuf += e.key;
    return;
  }
  if (e.code === "Enter" && !e.repeat) {
    if (state === "gameover" || (state === "win" && winT >= WIN_SCENE)) beginRun();
    else if (state === "win" && winT > 60) winT = WIN_SCENE;   // kutlamayı atla
  }
  if (e.code === "Escape" && (state === "gameover" || state === "win")) state = "title";
  if ((e.code === "Space" || e.code === "ArrowUp") && !e.repeat) p.buf = 8;
  keys[e.code] = true;
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

/* ---------- döngü ---------- */
buildLevel();
p.x = cp.x; p.y = cp.y;
connect();
let last = 0, acc = 0;
function loop(ts) {
  const dt = Math.min(100, ts - last); last = ts; acc += dt;
  while (acc >= 16.667) { update(); acc -= 16.667; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts => { last = ts; loop(ts); });
</script>
